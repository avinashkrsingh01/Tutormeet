# Supabase local development config
# Run `supabase init` then `supabase start` to use local dev stack.

[api]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # set to true in production

[storage]
file_size_limit = "10MB"
